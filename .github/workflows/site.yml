# Publiceert site/ naar GitHub Pages, op allmid.gg.
#
# Los van build.yml gehouden en met een eigen paths-filter: een tekstwijziging op
# de site hoeft geen installer te bouwen, en een codewijziging hoeft de site niet
# opnieuw uit te rollen.
#
# Eenmalig in de repo instellen: Settings -> Pages -> Source op "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Bij snel achter elkaar pushen wint de laatste; halverwege afbreken is prima
# omdat er niets half uitgerold kan achterblijven.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # De site is statisch: geen bouwstap, de map gaat er zo in.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
